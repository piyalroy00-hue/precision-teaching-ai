services:
  - type: web
    name: precision-teaching-ai
    env: python
    region: oregon
    plan: standard
    buildCommand: "pip install -r requirements.txt && python scripts/init_db.py"
    startCommand: "gunicorn app.main:app"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: FLASK_ENV
        value: production
      - key: AI_TUTOR_PROVIDER
        value: local
databases:
  - name: precision-teaching-db
    plan: free
    region: oregon
