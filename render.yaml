services:
  - type: web
    name: precision-teaching-ai
    runtime: python
    region: oregon
    plan: standard
    buildCommand: "pip install -r requirements.txt"
    preDeployCommand: "python scripts/init_db.py"
    startCommand: "gunicorn app.main:app"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: FLASK_ENV
        value: production
      - key: APP_ENV
        value: production
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: AI_TUTOR_PROVIDER
        value: local
      - key: DATABASE_URL
        fromDatabase:
          name: precision-teaching-db
          property: connectionString
databases:
  - name: precision-teaching-db
    plan: free
    region: oregon
