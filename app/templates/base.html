<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>{% block title %}Precision Teaching AI{% endblock %}</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap"
            rel="stylesheet"
        />
        <style>
            :root {
                --ink: #172033;
                --muted: #647089;
                --line: #dfe5ed;
                --surface: #ffffff;
                --canvas: #f3f6f8;
                --brand: #0b7285;
                --brand-dark: #075b6a;
                --accent: #f59f00;
                --success: #087f5b;
                --danger: #c92a2a;
                --shadow: 0 12px 28px rgba(23, 32, 51, 0.08);
            }
            * {
                box-sizing: border-box;
            }
            body {
                min-height: 100vh;
                margin: 0;
                padding-top: 70px;
                background-color: var(--canvas);
                background-image:
                    linear-gradient(
                        90deg,
                        rgba(11, 114, 133, 0.035) 1px,
                        transparent 1px
                    ),
                    linear-gradient(
                        rgba(11, 114, 133, 0.035) 1px,
                        transparent 1px
                    );
                background-size: 28px 28px;
                color: var(--ink);
                font-family: "DM Sans", sans-serif;
                line-height: 1.55;
            }
            .navbar {
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                height: 70px;
                background: var(--surface);
                border-bottom: 1px solid var(--line);
                box-shadow: 0 2px 8px rgba(23, 32, 51, 0.06);
                z-index: 1000;
            }
            .navbar-container {
                display: flex;
                align-items: center;
                justify-content: space-between;
                width: min(1120px, calc(100% - 32px));
                height: 100%;
                margin: 0 auto;
                padding: 0 16px;
            }
            .navbar-brand {
                flex-shrink: 0;
            }
            .navbar-brand a {
                display: flex;
                align-items: center;
                color: var(--brand);
                font-size: 16px;
                font-weight: 700;
                text-decoration: none;
                letter-spacing: -0.5px;
            }
            .navbar-brand a:hover {
                color: var(--brand-dark);
            }
            .navbar-menu {
                display: flex;
                align-items: center;
                gap: 24px;
                flex-wrap: wrap;
            }
            .navbar-link {
                color: var(--muted);
                font-size: 14px;
                font-weight: 500;
                text-decoration: none;
                padding: 8px 0;
                border-bottom: 2px solid transparent;
                transition: all 150ms ease;
            }
            .navbar-link:hover {
                color: var(--brand);
                border-bottom-color: var(--brand);
            }
            .navbar-logout {
                color: var(--danger);
            }
            .navbar-logout:hover {
                color: #a51111;
                border-bottom-color: var(--danger);
            }
            @media (max-width: 768px) {
                body {
                    padding-top: 100px;
                }
                .navbar {
                    height: auto;
                }
                .navbar-container {
                    flex-wrap: wrap;
                    padding: 12px 16px;
                }
                .navbar-brand {
                    width: 100%;
                    margin-bottom: 8px;
                }
                .navbar-menu {
                    width: 100%;
                    gap: 12px;
                }
                .navbar-link {
                    font-size: 13px;
                }
            }
            @media (max-width: 600px) {
                body {
                    padding-top: 110px;
                }
                .navbar-menu {
                    gap: 10px;
                }
            }
            .container {
                width: min(1120px, calc(100% - 32px));
                margin: 48px auto;
            }
            .card {
                background: var(--surface);
                border: 1px solid var(--line);
                border-radius: 8px;
                padding: clamp(24px, 4vw, 40px);
                box-shadow: var(--shadow);
            }
            h1,
            h2 {
                color: var(--ink);
                line-height: 1.15;
                letter-spacing: 0;
            }
            h1 {
                margin: 0 0 10px;
                font-size: clamp(28px, 4vw, 40px);
            }
            h2 {
                margin: 32px 0 12px;
                font-size: 19px;
            }
            h3 {
                margin: 0;
                font-size: 16px;
            }
            p {
                margin: 8px 0;
            }
            a {
                color: var(--brand);
                font-weight: 600;
                text-underline-offset: 3px;
            }
            pre {
                overflow-x: auto;
                padding: 16px;
                border: 1px solid #cfe0e4;
                border-radius: 6px;
                background: #f0f8f8;
                color: #12414a;
                font-family: "DM Mono", monospace;
                font-size: 13px;
            }
            form {
                display: grid;
                gap: 16px;
                margin-top: 20px;
            }
            label {
                display: grid;
                gap: 6px;
                color: #344054;
                font-size: 14px;
                font-weight: 600;
            }
            input,
            select,
            button {
                min-height: 44px;
                border-radius: 6px;
                font: inherit;
            }
            input,
            select {
                width: 100%;
                padding: 10px 12px;
                border: 1px solid #bfc9d8;
                color: var(--ink);
                background: #fff;
            }
            input:focus,
            select:focus,
            button:focus-visible,
            a:focus-visible {
                outline: 3px solid rgba(11, 114, 133, 0.25);
                outline-offset: 2px;
                border-color: var(--brand);
            }
            button {
                justify-self: start;
                padding: 10px 18px;
                border: 1px solid var(--brand);
                background: var(--brand);
                color: #fff;
                font-weight: 700;
                border: none;
                cursor: pointer;
                transition:
                    background 150ms ease,
                    transform 150ms ease;
            }
            button:hover {
                background: var(--brand-dark);
                transform: translateY(-1px);
            }
            .error {
                margin: 16px 0;
                padding: 12px 14px;
                border-left: 4px solid var(--danger);
                background: #fff5f5;
                color: #a51111;
            }
            .success {
                margin: 16px 0;
                padding: 12px 14px;
                border-left: 4px solid var(--success);
                background: #ebfbee;
                color: #056044;
            }
            .meta {
                color: var(--muted);
                font-size: 14px;
            }
            .nav {
                display: flex;
                flex-wrap: wrap;
                gap: 8px 18px;
                align-items: center;
                margin: -4px 0 32px;
                padding-bottom: 16px;
                border-bottom: 1px solid var(--line);
            }
            .nav a {
                text-decoration: none;
                color: #43516a;
                font-size: 14px;
            }
            .nav a:hover {
                color: var(--brand);
            }
            .nav a:last-child {
                color: var(--danger);
            }
            .metrics {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
                gap: 12px;
                margin: 20px 0 28px;
            }
            .metric {
                padding: 16px;
                border: 1px solid var(--line);
                border-radius: 6px;
                background: #fafcfd;
            }
            .metric-label {
                color: var(--muted);
                font-size: 13px;
                font-weight: 600;
            }
            .metric-value {
                margin-top: 5px;
                color: var(--ink);
                font-size: 26px;
                font-weight: 700;
            }
            .panel {
                margin-top: 14px;
                padding: 20px;
                border: 1px solid var(--line);
                border-radius: 6px;
                background: #fff;
            }
            .badge {
                display: inline-block;
                padding: 3px 8px;
                border-radius: 999px;
                background: #e1f3f5;
                color: #076575;
                font-size: 12px;
                font-weight: 700;
            }
            table {
                overflow: hidden;
                border: 1px solid var(--line);
                border-radius: 6px;
                border-collapse: separate;
                border-spacing: 0;
                width: 100%;
                margin-top: 16px;
            }
            th,
            td {
                padding: 12px 14px;
                text-align: left;
                border-bottom: 1px solid var(--line);
            }
            th {
                background: #f5f8fa;
                color: #46536a;
                font-size: 12px;
                text-transform: uppercase;
                letter-spacing: 0.04em;
            }
            tr:last-child td {
                border-bottom: 0;
            }
            .answer {
                display: flex;
                align-items: center;
                gap: 10px;
                margin: 0;
                padding: 13px 14px;
                border: 1px solid var(--line);
                border-radius: 6px;
                background: #fff;
                cursor: pointer;
            }
            .answer:hover {
                border-color: var(--brand);
                background: #f1fbfc;
            }
            .answer input {
                width: auto;
                min-height: 0;
                margin: 0;
            }
            .answer:has(input:checked) {
                border-color: var(--brand);
                background: #e8f7f8;
            }
            section + section {
                margin-top: 16px;
            }
            .grid {
                display: grid;
                gap: 16px;
            }
            .site-footer {
                padding: 18px 4px 0;
                color: var(--muted);
                font-size: 13px;
                text-align: center;
            }
            @media (max-width: 600px) {
                .container {
                    width: min(100% - 20px, 1120px);
                    margin: 20px auto;
                }
                .card {
                    padding: 22px 18px;
                }
                .nav {
                    gap: 8px 12px;
                    margin-bottom: 24px;
                }
                th,
                td {
                    padding: 10px;
                }
            }
        </style>
    </head>
    <body>
        <!-- Template version: 2026-11-25 15:54 - Role-based navbar -->
        {% include 'navbar.html' %}
        <div class="container">
            {% block content %}{% endblock %}
            <footer class="site-footer">Developed by Smaranika Roy</footer>
        </div>
    </body>
</html>
