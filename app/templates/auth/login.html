{% extends 'base.html' %} {% block title %}Precision Teaching AI{% endblock %}
{% block content %}
<div class="card">
    <span class="badge">Precision Teaching AI</span>
    <h1>Welcome back</h1>
    <p class="meta">Sign in to continue your personalized learning journey.</p>
    <div class="nav">
        <a href="/">Login</a> | <a href="/register">Register</a>
    </div>

    {% if error %}
    <p class="error">{{ error }}</p>
    {% endif %}

    <form method="post" class="panel">
        <label
            >Email
            <input type="email" name="email" required />
        </label>
        <label
            >Password
            <input type="password" name="password" required />
        </label>
        <button type="submit">Log in</button>
    </form>
</div>
{% endblock %}
